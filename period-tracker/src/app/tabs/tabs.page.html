
<!-- ========================================
     SHED - BOTTOM NAVIGATION
======================================== -->

<ion-tabs>

  <ion-tab-bar
    slot="bottom"
    class="shed-tab-bar">

    <!-- ====================================
         DASHBOARD
    ==================================== -->

    <ion-tab-button
      tab="dashboard"
      aria-label="Dashboard">

      <ion-icon
        name="home-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-label>
        Home
      </ion-label>

    </ion-tab-button>

    <!-- ====================================
         CALENDAR
    ==================================== -->

    <ion-tab-button
      tab="calendar"
      aria-label="Calendar">

      <ion-icon
        name="calendar-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-label>
        Calendar
      </ion-label>

    </ion-tab-button>

    <!-- ====================================
         TRACK
    ==================================== -->

    <ion-tab-button
      tab="track"
      aria-label="Track Period and Wellness">

      <ion-icon
        name="add-circle-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-label>
        Track
      </ion-label>

    </ion-tab-button>

    <!-- ====================================
         HISTORY
    ==================================== -->

    <ion-tab-button
      tab="history"
      aria-label="History">

      <ion-icon
        name="time-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-label>
        History
      </ion-label>

    </ion-tab-button>

    <!-- ====================================
         PROFILE
    ==================================== -->

    <ion-tab-button
      tab="profile"
      aria-label="Profile">

      <ion-icon
        name="person-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-label>
        Profile
      </ion-label>

    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
